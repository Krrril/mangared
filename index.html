<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="toVKWleq4iUywcOMhiv1sMNrYzv69TxAEDWZ-a-ICgw" />
    <title>MangaGreen — Read Manga in English Online</title>
    <meta
      name="description"
      content="MangaGreen — read manga, manhwa and comics in English online for free. Читайте мангу и манхву на английском языке онлайн бесплатно."
    />
    <meta
      name="keywords"
      content="manga in English, read manga online, manhwa, comics, читать мангу на английском языке, манга на английском, читать на английском комиксы манхвы"
    />
    <!--
      Первые 3 панели PublishHero видны на всех вьюпортах (мобильный
      показывает только их, десктоп — все 6, см. PublishHero.module.css);
      это самый крупный визуальный блок в первом экране и обычно LCP-
      кандидат. Без preload браузер узнаёт про них поздно — это
      background-image, объявленный инлайн-стилем из React уже после
      гидратации, а не <img> в разметке.
    -->
    <link rel="preload" as="image" fetchpriority="high" href="/hero/panel-1-blue.webp" />
    <link rel="preload" as="image" fetchpriority="high" href="/hero/panel-2-green.webp" />
    <link rel="preload" as="image" fetchpriority="high" href="/hero/panel-3-warm.webp" />
  </head>
  <body>
    <script>
      // Ставим тему до первой отрисовки, чтобы не мигало тёмным перед
      // тем, как React применит сохранённую светлую (см. services/theme).
      try {
        var theme = localStorage.getItem('mangared:theme')
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'
      } catch (e) {}
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
